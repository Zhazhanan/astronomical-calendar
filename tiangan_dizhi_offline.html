<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>天干·地支·节气 · 日地月教学视图</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{color-scheme:dark;--space:#020617;--panel:rgba(3,7,18,.86);--border:rgba(148,163,184,.28);--text:#f8fafc;--muted:#cbd5e1;--accent:#38bdf8}
  *{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden;background:var(--space);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
  .scene-grid{position:fixed;inset:0;z-index:1;display:grid;pointer-events:none}.scene-grid.scene-layout-desktop{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:1fr}.scene-grid.scene-layout-tablet{grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr))}.scene-grid.scene-layout-mobile{grid-template-columns:1fr;grid-template-rows:1fr}
  .scene-viewport{position:relative;z-index:1;min-width:0;min-height:0;border-right:1px solid rgba(148,163,184,.25)}.scene-viewport h2{position:absolute;left:16px;top:16px;margin:0;font-size:15px;letter-spacing:.04em;pointer-events:none}.scene-interaction{position:absolute;inset:0;pointer-events:auto;touch-action:none}#astronomyCanvas{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}#labelLayer{position:fixed;inset:0;z-index:10;overflow:hidden;pointer-events:none}.scene-label{color:#f8fafc;position:absolute;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.95)}
  #ui,#hud,#credits{color:var(--text);background:var(--panel);border:1px solid var(--border);box-shadow:0 16px 40px rgba(0,0,0,.34);backdrop-filter:blur(12px)}#ui{position:absolute;left:12px;top:12px;width:min(350px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;z-index:50;padding:16px;border-radius:14px}#ui h1{margin:0 0 12px;font-size:18px;line-height:1.4}label{display:block;margin:7px 0;font-size:14px;line-height:1.5;color:var(--text)}input[disabled]{opacity:.55}.btn{min-height:38px;padding:8px 13px;color:#fff;background:linear-gradient(180deg,#38bdf8,#0ea5e9);border:1px solid rgba(125,211,252,.55);border-radius:8px;font-weight:600;cursor:pointer;margin-right:7px}.small,.note,#appStatus{font-size:12px;line-height:1.55;color:var(--muted);margin-top:8px}#hud{position:absolute;right:12px;top:12px;z-index:50;width:300px;padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.7;font-variant-numeric:tabular-nums}#credits{position:absolute;right:12px;bottom:12px;z-index:50;padding:7px 10px;border-radius:8px;font-size:12px;color:#94a3b8}
  @media (max-width:720px){#ui{max-height:46vh;padding:13px}#hud{left:12px;right:12px;top:auto;bottom:12px;width:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;font-size:12px;line-height:1.45}#credits{display:none}}
</style>
</head>
<body>
<section class="scene-grid scene-layout-desktop" data-layout="desktop" aria-label="日地月双视角">
  <article id="heliocentricViewport" class="scene-viewport"><h2>太阳中心视角</h2><div class="scene-interaction" aria-label="拖动旋转太阳中心场景"></div></article>
  <article id="geocentricViewport" class="scene-viewport"><h2>地球中心视角</h2><div class="scene-interaction" aria-label="拖动旋转地球中心场景"></div></article>
  <canvas id="astronomyCanvas" aria-label="太阳、地球与月球三维教学场景"></canvas>
</section>
<div id="labelLayer" aria-hidden="true"></div>
<div id="ui"><h1>天干·地支·节气</h1>
  <label><input id="showEcl" type="checkbox" checked disabled> 黄道、赤道与二十四节气由地球中心视角显示</label>
  <label><input id="showSolarAngle" type="checkbox" checked disabled> 太阳黄经角由地球中心视角显示</label>
  <label><input id="showJiazi" type="checkbox" disabled> 六十甲子空间连线（本教学视图不使用）</label>
  <div class="small">大小与距离采用不同增强比例。太阳、地球、月球的位置为教学级近似，仅用于可视化与教育展示，不可用于导航或日食、月食预测。</div>
  <div style="margin-top:8px"><button id="resetBtn" class="btn">重置两个视角</button><button id="snapBtn" class="btn">导出 PNG</button></div><div id="appStatus" role="status"></div>
</div>
<div id="hud"><div id="localTime">本地时间: —</div><div id="utcTime">UTC: —</div><div id="solarLon">太阳黄经 (λ): —</div><div id="solarAngleValue">地球—太阳黄经角: —</div><div id="currentJieqi">当前节气: —</div><div id="toNextJieqi">距下节气: —</div><div id="sunCoords">太阳赤经/赤纬: —</div></div>
<div id="credits">离线版 · 深空主题 · 高对比教学视图</div>
<script src="./three.min.js"></script><script src="./OrbitControls.js"></script><script src="vendor/lunar/lunar.js"></script><script src="js/astronomy-core.js"></script><script src="js/calendar-core.js"></script><script src="js/observer-core.js"></script><script src="js/world-state.js"></script><script src="js/time-controller.js"></script><script src="js/scene-host.js"></script><script src="js/heliocentric-scene.js"></script><script src="js/geocentric-scene.js"></script><script src="js/app.js"></script>
<script>document.addEventListener('DOMContentLoaded', function () { AstroEducation.App.start(); });</script>
</body>
</html>
