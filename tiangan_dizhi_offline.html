<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>天干·地支·节气 · 专业可视化（深空主题）</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    color-scheme:dark;
    --space:#020617;
    --panel:rgba(3, 7, 18, 0.86);
    --panel-border:rgba(148, 163, 184, 0.28);
    --text:#f8fafc;
    --muted:#cbd5e1;
    --accent:#38bdf8;
    --accent-strong:#0ea5e9;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--space);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
  #canvasContainer{position:fixed; inset:0; z-index:0}
  #canvasContainer canvas{display:block}
  #labelLayer{position:fixed;inset:0;z-index:10;overflow:hidden;pointer-events:none}
  .space-label{position:absolute;white-space:nowrap;font-weight:600;line-height:1;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.95);transform:translate(-50%,-50%);will-change:left,top}
  #ui,#hud,#credits{color:var(--text);background:var(--panel);border:1px solid var(--panel-border);box-shadow:0 16px 40px rgba(0,0,0,0.34);backdrop-filter:blur(12px)}
  #ui{position:absolute;left:12px;top:12px;width:min(350px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;z-index:50;padding:16px;border-radius:14px}
  #ui h2{margin:0 0 12px;font-size:18px;line-height:1.4;color:#fff;letter-spacing:.04em}
  label{display:block;margin:7px 0;font-size:14px;line-height:1.5;color:var(--text)}
  input[type="checkbox"]{accent-color:var(--accent);width:15px;height:15px;vertical-align:-2px}
  .btn{min-height:38px;padding:8px 13px;color:#fff;background:linear-gradient(180deg,var(--accent),var(--accent-strong));border:1px solid rgba(125,211,252,.55);border-radius:8px;box-shadow:0 6px 18px rgba(14,165,233,.22);font-weight:600;cursor:pointer;margin-right:7px}
  .btn:hover{filter:brightness(1.1)}
  .btn:focus-visible,input:focus-visible{outline:2px solid #facc15;outline-offset:2px}
  .small{font-size:12px;line-height:1.55;color:var(--muted);margin-top:8px}
  #hud{position:absolute;right:12px;top:12px;z-index:50;width:300px;padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.7;font-variant-numeric:tabular-nums}
  .note{font-size:12px;line-height:1.6;color:var(--muted);margin-top:10px}
  #credits{position:absolute;right:12px;bottom:12px;z-index:50;padding:7px 10px;border-radius:8px;font-size:12px;color:#94a3b8}
  hr{border-color:rgba(148,163,184,.22)!important}
  @media (max-width:720px){
    #ui{max-height:46vh;padding:13px}
    #hud{left:12px;right:12px;top:auto;bottom:12px;width:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;font-size:12px;line-height:1.45}
    #credits{display:none}
  }
</style>
</head>
<body>
<div id="canvasContainer"></div>
<div id="labelLayer" aria-hidden="true"></div>

<div id="ui">
  <h2>天干·地支·节气（专业版）</h2>

  <label><input id="showEcl" type="checkbox" checked> 显示黄道</label>
  <label><input id="showEq" type="checkbox" checked> 显示天球赤道（单圈）</label>
  <label><input id="showGal" type="checkbox"> 显示银河示意</label>

  <label>
    <input id="showTiangan" type="checkbox" checked> 天干（10）
    <input id="showDizhi" type="checkbox" checked style="margin-left:8px"> 地支（12）
  </label>

  <label><input id="showJieqi" type="checkbox" checked> 显示二十四节气（并高亮今日）</label>
  <label><input id="show28xiu" type="checkbox" checked> 显示二十八宿带</label>
  <label style="margin-left:16px"><input id="show28xiuLabels" type="checkbox" checked> 显示二十八宿标签</label>

  <label><input id="showJiazi" type="checkbox" checked> 显示六十甲子连线</label>
  <label><input id="showSun" type="checkbox" checked> 显示太阳（教学近似位置）</label>
  <label><input id="showSolarAngle" type="checkbox" checked> 显示太阳黄经角度</label>
  <div class="small">白色虚线：春分 0° 基准；橙线：地球指向太阳；黄色弧：当前太阳黄经角。数值为教学级近似，仅用于可视化与教育展示，不可用于导航或日食、月食预测。</div>

  <div style="margin-top:8px">
    <button id="resetBtn" class="btn">重置视角</button>
    <button id="snapBtn" class="btn">导出 PNG</button>
  </div>

  <div class="note">说明：太阳位置与黄经角使用教学级近似（基于 Julian Day + 均近点近似 + 摆动补偿），仅用于可视化与教育展示，不可用于导航或日食、月食预测。</div>
</div>

<div id="hud">
  <div id="localTime">本地时间: —</div>
  <div id="utcTime">UTC: —</div>
  <div id="solarLon">太阳黄经 (λ): —</div>
  <div id="solarAngleValue">地球—太阳黄经角: —</div>
  <div id="currentJieqi">当前节气: —</div>
  <div id="toNextJieqi">距下节气: —</div>
  <div id="sunCoords">太阳赤经/赤纬: —</div>
</div>

<div id="credits">离线版 · 深空主题 · 高对比可视化</div>

<!-- 本地 three + OrbitControls（UMD 非 module） -->
<script src="./three.min.js"></script>
<script src="./OrbitControls.js"></script>
<script src="js/astronomy-core.js"></script>
<script src="js/world-state.js"></script>

<script>
/* ----------------- 场景与群组 ------------------ */
const container = document.getElementById('canvasContainer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020617);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 6000);
camera.position.set(0, 180, 420);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio || 1);
container.appendChild(renderer.domElement);
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;

/* Groups */
const groups = {
  ecliptic: new THREE.Group(), equator: new THREE.Group(), galactic: new THREE.Group(),
  tiangan: new THREE.Group(), dizhi: new THREE.Group(), jieqi: new THREE.Group(),
  xiu: new THREE.Group(), jiazi: new THREE.Group(),
  sun: new THREE.Group(), solarAngle: new THREE.Group(), earthmoon: new THREE.Group()
};
Object.values(groups).forEach(g=>scene.add(g));

/* star field */
(function buildStarfield(){
  const count = 1800;
  const positions = new Float32Array(count * 3);
  for(let i=0;i<count;i++){
    const radius = 900 + Math.random() * 1500;
    const theta = Math.random() * Math.PI * 2;
    const cosPhi = Math.random() * 2 - 1;
    const sinPhi = Math.sqrt(1 - cosPhi * cosPhi);
    positions[i*3] = radius * sinPhi * Math.cos(theta);
    positions[i*3+1] = radius * cosPhi;
    positions[i*3+2] = radius * sinPhi * Math.sin(theta);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({color:0xffffff,size:2.2,transparent:true,opacity:0.82,depthWrite:false});
  scene.add(new THREE.Points(geometry, material));
})();

/* celestial sphere wire */
(function(){
  const geo = new THREE.SphereGeometry(200, 64, 32);
  const mat = new THREE.MeshBasicMaterial({color:0x64748b, wireframe:true, opacity:0.16, transparent:true});
  const mesh = new THREE.Mesh(geo, mat); scene.add(mesh);
})();

/* constants */
const R = 200;
const obliquity = 23.43929111 * Math.PI/180;
const MOON_DISPLAY_ORBIT_RADIUS = 24;

function toVector3(point){
  return new THREE.Vector3(point.x, point.y, point.z);
}
function eclipticVector(longitudeDeg, radius=R){
  return toVector3(AstroEducation.Astronomy.tiltedDisplayPoint(longitudeDeg, radius, obliquity));
}

/* screen-space labels stay legible regardless of camera distance */
const labelLayer = document.getElementById('labelLayer');
const screenLabels = [];
function makeScreenLabel(text, size=36, color="#f8fafc", priority=1){
  const anchor = new THREE.Object3D();
  const element = document.createElement('div');
  element.className = 'space-label';
  element.textContent = text;
  element.style.color = color;
  const fontSize = Math.max(14, Math.round(size * 0.5));
  element.style.fontSize = fontSize + 'px';
  labelLayer.appendChild(element);
  anchor.userData.labelElement = element;
  screenLabels.push({anchor, element, fontSize, priority});
  return anchor;
}
function degToRad(d){ return d * Math.PI/180; }

/* ----------------- 绘制参考环（黄道/赤道/银河） ----------------- */
(function buildEcliptic(){
  const pts=[];
  for(let a=0;a<360;a+=1){
    pts.push(eclipticVector(a, R));
  }
  const geom = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geom, new THREE.LineBasicMaterial({color:0xfacc15, linewidth:1, opacity:1}));
  groups.ecliptic.add(line);
})();
(function buildEquator(){
  const pts=[];
  for(let a=0;a<360;a+=1){
    const lon = degToRad(a);
    const x = Math.cos(lon);
    const y = 0;
    const z = Math.sin(lon);
    pts.push(new THREE.Vector3(x*R, y*R, z*R));
  }
  const geom = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geom, new THREE.LineBasicMaterial({color:0x38bdf8, linewidth:1, opacity:1}));
  groups.equator.add(line);
})();
(function buildGalactic(){
  const tiltG = 60 * Math.PI/180;
  const pts=[];
  for(let a=0;a<360;a+=1){
    const lon = degToRad(a);
    const x = Math.cos(lon);
    const y = Math.sin(lon)*Math.cos(tiltG);
    const z = Math.sin(lon)*Math.sin(tiltG);
    pts.push(new THREE.Vector3(x*R, y*R, z*R));
  }
  const geom = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geom, new THREE.LineBasicMaterial({color:0xa78bfa, opacity:0.45, transparent:true}));
  groups.galactic.add(line);
})();
groups.galactic.visible = false;

/* ----------------- 二十四节气（环上标签） ----------------- */
const jieqiNames = AstroEducation.Astronomy.SOLAR_TERMS;
(function buildJieqi(){
  const r = R * 0.92;
  for(let i=0;i<24;i++){
    const pos = eclipticVector(i * 15, r);
    const lab = makeScreenLabel(jieqiNames[i], 25, "#f8fafc", 6);
    lab.position.copy(pos);
    groups.jieqi.add(lab);
  }
})();

/* ----------------- 天干/地支/二十八宿/甲子 ----------------- */
const tiangan = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const dizhi = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
(function buildTG_DZ(){
  const r1 = R*0.45, r2 = R*0.65;
  tiangan.forEach((t,i)=>{
    const ang = i/10 * Math.PI*2 - Math.PI/2;
    const sp = makeScreenLabel(t, 42, "#67e8f9", 7);
    sp.position.set(Math.cos(ang)*r1, -30, Math.sin(ang)*r1);
    groups.tiangan.add(sp);
  });
  dizhi.forEach((d,i)=>{
    const ang = i/12 * Math.PI*2 - Math.PI/2;
    const sp = makeScreenLabel(d, 38, "#fbbf24", 7);
    sp.position.set(Math.cos(ang)*r2, -36, Math.sin(ang)*r2);
    groups.dizhi.add(sp);
  });
})();

const xiuNames = ["角","亢","氐","房","心","尾","箕","斗","牛","女","虚","危","室","壁","奎","娄","胃","昴","毕","觜","参","井","鬼","柳","星","张","翼","轸"];
(function build28xiuDefault(){
  const r = R*0.98;
  for(let i=0;i<28;i++){
    const pos = eclipticVector(i / 28 * 360, r);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(2.1,8,6), new THREE.MeshBasicMaterial({color:0xc4b5fd}));
    dot.position.copy(pos); groups.xiu.add(dot);
    const label = makeScreenLabel(xiuNames[i], 23, "#ddd6fe", 2);
    label.position.copy(pos.clone().multiplyScalar(1.02)); groups.xiu.add(label);
  }
})();

/* 60 甲子连线 */
function buildJiazi(){
  groups.jiazi.clear && groups.jiazi.clear();
  for(let i=0;i<60;i++){
    const tgIdx = i % 10, dzIdx = i % 12;
    const angTG = tgIdx/10 * Math.PI*2 - Math.PI/2;
    const posTG = new THREE.Vector3(Math.cos(angTG)*R*0.45, -28, Math.sin(angTG)*R*0.45);
    const angDZ = dzIdx/12 * Math.PI*2 - Math.PI/2;
    const posDZ = new THREE.Vector3(Math.cos(angDZ)*R*0.65, -36, Math.sin(angDZ)*R*0.65);
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([posTG,posDZ]), new THREE.LineBasicMaterial({color:0x22d3ee, opacity:0.28, transparent:true}));
    groups.jiazi.add(line);
    const mid = posTG.clone().add(posDZ).multiplyScalar(0.5);
    const marker = new THREE.Mesh(new THREE.SphereGeometry(1.8,8,6), new THREE.MeshBasicMaterial({color:0xfacc15}));
    marker.position.copy(mid); marker.userData = {name: tiangan[tgIdx]+dizhi[dzIdx], idx:i};
    groups.jiazi.add(marker);
  }
}
buildJiazi();

/* ----------------- 太阳显示（教学近似） ----------------- */
function buildSun(){
  groups.sun.clear && groups.sun.clear();
  const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(R*0.06, 24, 16), new THREE.MeshBasicMaterial({color:0xffd24d}));
  groups.sun.add(sunMesh);
  const sunLabel = makeScreenLabel('太阳', 22, '#fde68a', 8);
  sunLabel.position.set(0, R*0.06*2, 0); groups.sun.add(sunLabel);
}
buildSun();

function replaceLinePoints(line, points){
  line.geometry.dispose();
  line.geometry = new THREE.BufferGeometry().setFromPoints(points);
  if(line.computeLineDistances) line.computeLineDistances();
}

function buildSolarAngleGuide(){
  const origin = new THREE.Vector3(0,0,0);
  const referenceEnd = eclipticVector(0, R*0.98);
  const referenceLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([origin, referenceEnd]),
    new THREE.LineDashedMaterial({color:0xe2e8f0, dashSize:7, gapSize:5, opacity:0.62, transparent:true})
  );
  referenceLine.computeLineDistances();

  const sunRay = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([origin, origin]),
    new THREE.LineBasicMaterial({color:0xfb923c, opacity:0.92, transparent:true})
  );
  const angleArc = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([origin, origin]),
    new THREE.LineBasicMaterial({color:0xfacc15, opacity:0.96, transparent:true})
  );

  const referenceLabel = makeScreenLabel('0° · 春分基准', 18, '#e2e8f0', 9);
  referenceLabel.position.copy(eclipticVector(0, R*0.58));
  const angleLabel = makeScreenLabel('太阳黄经 λ 0.0°', 24, '#fdba74', 9);
  angleLabel.position.copy(eclipticVector(0, R*0.36));

  groups.solarAngle.add(referenceLine, sunRay, angleArc, referenceLabel, angleLabel);
  groups.solarAngle.userData = {sunRay, angleArc, angleLabel};
}
buildSolarAngleGuide();

function updateSolarAngleGuide(worldState, sunPosition){
  const longitudeDeg = worldState.sun.longitudeDeg;
  const guide = groups.solarAngle.userData;
  replaceLinePoints(guide.sunRay, [new THREE.Vector3(0,0,0), sunPosition]);
  const arcPoints = AstroEducation.Astronomy
    .tiltedLongitudeArcPoints(longitudeDeg, R*0.34, obliquity, 2)
    .map(toVector3);
  replaceLinePoints(guide.angleArc, arcPoints);
  guide.angleLabel.position.copy(eclipticVector(longitudeDeg / 2, R*0.42));
  guide.angleLabel.userData.labelElement.textContent = '太阳黄经 λ ' + longitudeDeg.toFixed(1) + '°';
}

function updateSunNow(worldState){
  const sun = worldState.sun;
  const lon = sun.longitudeDeg;
  const pos = eclipticVector(lon, R*0.98);
  groups.sun.position.copy(pos);
  updateSolarAngleGuide(worldState, pos);
  // HUD
  document.getElementById('solarLon').textContent = '太阳黄经 (λ): ' + lon.toFixed(4) + '°';
  document.getElementById('solarAngleValue').textContent = '地球—太阳黄经角: ' + lon.toFixed(1) + '°（从春分点逆时针）';
  document.getElementById('sunCoords').textContent = `太阳 赤经 ${sun.rightAscensionDeg.toFixed(4)}°, 赤纬 ${sun.declinationDeg.toFixed(4)}°`;
  // determine current jieqi index (24 sectors)
  const currentTerm = AstroEducation.Astronomy.solarTermSectorAtLongitude(lon);
  const sector = currentTerm.index;
  document.getElementById('currentJieqi').textContent = '当前节气区: ' + currentTerm.name + ` (λ in [${(sector*15).toFixed(0)}°,${((sector+1)*15).toFixed(0)}°))`;
  document.getElementById('toNextJieqi').textContent = '距下节气(估算): ' + ( ( ( ( ( ( (sector+1)*15 ) - lon ) / 360 ) * 365.2422 ) ).toFixed(3) ) + ' 天';
}

/* ----------------- earth & moon (simplified pure color) ----------------- */
(function buildEarthMoon(){
  const earth = new THREE.Mesh(new THREE.SphereGeometry(8, 32, 32), new THREE.MeshPhongMaterial({color:0x4b82ff}));
  const earthPivot = new THREE.Group(); earthPivot.add(earth);
  earth.position.set(0, 0, 0);
  groups.earthmoon.add(earthPivot);

  const moon = new THREE.Mesh(new THREE.SphereGeometry(2.2, 24,24), new THREE.MeshPhongMaterial({color:0xcfcfcf}));
  moon.position.set(MOON_DISPLAY_ORBIT_RADIUS, 0, 0);
  groups.earthmoon.add(moon);
  groups.earthmoon.userData = {earth, moon};
})();
scene.add(new THREE.AmbientLight(0xffffff, 0.95));
const dl = new THREE.DirectionalLight(0xffffff, 0.6); dl.position.set(200,300,200); scene.add(dl);

/* ----------------- click interactions ----------------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (ev)=>{
  mouse.x = (ev.clientX / renderer.domElement.clientWidth) * 2 - 1;
  mouse.y = -(ev.clientY / renderer.domElement.clientHeight) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(groups.jiazi.children, true).filter(o=>o.object.userData && o.object.userData.name);
  if(hits.length>0){
    const d = hits[0].object.userData;
    alert('六十甲子: ' + d.name + '\\n序号: ' + d.idx);
  }
});

/* ----------------- HUD & animation ----------------- */
let cachedWorldState;
let currentWorldState;
function worldStateFor(instantUtc){
  if(!cachedWorldState || cachedWorldState.instantUtc !== instantUtc){
    cachedWorldState = AstroEducation.WorldState.create({instantUtc});
  }
  return cachedWorldState;
}
function updateHUD(){
  const currentDate = new Date();
  currentWorldState = worldStateFor(currentDate.getTime());
  document.getElementById('localTime').textContent = '本地时间: ' + currentDate.toLocaleString();
  document.getElementById('utcTime').textContent = 'UTC: ' + currentDate.toISOString().replace('T',' ').substr(0,19) + 'Z';
  updateSunNow(currentWorldState);
}

updateHUD();
setInterval(updateHUD, 1000);

const labelWorldPosition = new THREE.Vector3();
const labelScreenPosition = new THREE.Vector3();
function isObjectVisible(object){
  for(let node=object;node;node=node.parent){
    if(!node.visible) return false;
  }
  return true;
}
function estimateLabelBox(element, fontSize, x, y){
  const visualUnits = Array.from(element.textContent).reduce((total, char)=>{
    if(/[\u3400-\u9fff]/.test(char)) return total + 1;
    if(/\s/.test(char)) return total + 0.35;
    return total + 0.7;
  }, 0);
  const width = Math.max(fontSize, visualUnits * fontSize) * 1.2 + 8;
  const height = fontSize * 1.5 + 6;
  return {left:x-width/2, right:x+width/2, top:y-height/2, bottom:y+height/2};
}
function boxesOverlap(a, b){
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}
function updateScreenLabels(){
  scene.updateMatrixWorld(true);
  camera.updateMatrixWorld(true);
  const width = renderer.domElement.clientWidth;
  const height = renderer.domElement.clientHeight;
  const candidates = [];
  screenLabels.forEach((label, order)=>{
    const {anchor, element, fontSize, priority} = label;
    element.style.visibility = '';
    if(!isObjectVisible(anchor)){
      element.style.display = 'none';
      return;
    }
    anchor.getWorldPosition(labelWorldPosition);
    labelScreenPosition.copy(labelWorldPosition).project(camera);
    if(labelScreenPosition.z < -1 || labelScreenPosition.z > 1){
      element.style.display = 'none';
      return;
    }
    element.style.display = '';
    const x = (labelScreenPosition.x * 0.5 + 0.5) * width;
    const y = (-labelScreenPosition.y * 0.5 + 0.5) * height;
    element.style.left = x + 'px';
    element.style.top = y + 'px';
    candidates.push({element, priority, order, box:estimateLabelBox(element, fontSize, x, y)});
  });
  candidates.sort((a,b)=>b.priority-a.priority || a.order-b.order);
  const visibleBoxes = [];
  candidates.forEach(candidate=>{
    if(visibleBoxes.some(box=>boxesOverlap(candidate.box, box))){
      candidate.element.style.visibility = 'hidden';
      return;
    }
    visibleBoxes.push(candidate.box);
  });
}

function updateEarthMoon(worldState, deltaMs){
  if(!worldState) return;
  const {earth, moon} = groups.earthmoon.userData;
  const moonPositionKm = worldState.moon.positionKm;
  const moonDistanceKm = Math.hypot(moonPositionKm.x, moonPositionKm.y, moonPositionKm.z);
  // Distance is normalized only to keep the Moon visible; its WorldState direction is preserved.
  moon.position.set(
    moonPositionKm.x / moonDistanceKm * MOON_DISPLAY_ORBIT_RADIUS,
    moonPositionKm.y / moonDistanceKm * MOON_DISPLAY_ORBIT_RADIUS,
    moonPositionKm.z / moonDistanceKm * MOON_DISPLAY_ORBIT_RADIUS
  );
  earth.rotation.y += 0.0003 * deltaMs; // rendering-only spin, not astronomy state
  moon.rotation.y += 0.0005 * deltaMs;
}

let lastTime = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const tNow = performance.now();
  const dt = (tNow - lastTime); lastTime = tNow;

  updateEarthMoon(currentWorldState, dt);

  // toggle visibility per UI
  groups.ecliptic.visible = document.getElementById('showEcl').checked;
  groups.equator.visible = document.getElementById('showEq').checked;
  groups.galactic.visible = document.getElementById('showGal').checked;
  groups.tiangan.visible = document.getElementById('showTiangan').checked;
  groups.dizhi.visible = document.getElementById('showDizhi').checked;
  groups.jieqi.visible = document.getElementById('showJieqi').checked;
  groups.xiu.visible = document.getElementById('show28xiu').checked;
  // xiu labels
  const showXiuLabels = document.getElementById('show28xiuLabels').checked;
  groups.xiu.children.forEach(ch=>{
    if(ch.userData.labelElement) ch.visible = showXiuLabels;
  });
  groups.jiazi.visible = document.getElementById('showJiazi').checked;
  groups.sun.visible = document.getElementById('showSun').checked;
  groups.solarAngle.visible = document.getElementById('showSolarAngle').checked;

  controls.update();
  updateScreenLabels();
  renderer.render(scene, camera);
}
animate();

/* UI buttons */
document.getElementById('resetBtn').addEventListener('click', ()=>{
  camera.position.set(0,180,420); controls.target.set(0,0,0); controls.update();
});
function createSnapshotCanvas(){
  renderer.render(scene, camera);
  updateScreenLabels();
  const sourceCanvas = renderer.domElement;
  const sourceRect = sourceCanvas.getBoundingClientRect();
  const snapshot = document.createElement('canvas');
  snapshot.width = sourceCanvas.width;
  snapshot.height = sourceCanvas.height;
  const context = snapshot.getContext('2d');
  context.drawImage(sourceCanvas, 0, 0);
  const scaleX = snapshot.width / sourceRect.width;
  const scaleY = snapshot.height / sourceRect.height;
  screenLabels.forEach(({element})=>{
    const style = getComputedStyle(element);
    if(style.display === 'none' || style.visibility === 'hidden') return;
    const rect = element.getBoundingClientRect();
    const x = (rect.left + rect.width/2 - sourceRect.left) * scaleX;
    const y = (rect.top + rect.height/2 - sourceRect.top) * scaleY;
    context.save();
    context.fillStyle = style.color;
    context.font = `${style.fontWeight} ${parseFloat(style.fontSize) * scaleY}px ${style.fontFamily}`;
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.shadowColor = 'rgba(0,0,0,0.95)';
    context.shadowBlur = 5 * scaleY;
    context.fillText(element.textContent, x, y);
    context.restore();
  });
  return snapshot;
}
document.getElementById('snapBtn').addEventListener('click', ()=>{
  const url = createSnapshotCanvas().toDataURL('image/png');
  const a = document.createElement('a'); a.href = url; a.download = 'tianwen_snapshot.png'; a.click();
});
